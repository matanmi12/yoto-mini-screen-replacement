; ESP32-S3-DevKitC-1 as a USB-to-UART bridge (native "USB" port <-> UART1).
; Flashes a Beken BK7238 (Tuya T1-3S, OpenBeken) with ltchiptool, and a Yoto
; Mini (ESP32) with esptool, from macOS. Wiring: README.md.
[env:s3bridge]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags =
    -DARDUINO_USB_MODE=1        ; the board json forces the built-in USB-Serial-JTAG
build_flags =
    ; TinyUSB CDC (USB-OTG) instead of the built-in USB-Serial-JTAG: only
    ; TinyUSB exposes the host's baud rate and DTR/RTS to the firmware.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
; Updating this bridge: the firmware answers a 1200-baud "touch" by rebooting
; into the S3 ROM bootloader, so `pio run -t upload` works on the same port.
; If that ever fails: hold BOOT, tap RST, release BOOT, then upload.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
